name: CI Build & Zero-Trust Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test-windows:
    name: Build & xUnit Tests (.NET 9 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore USBAnywhere-Server.sln

      - name: Build Release
        run: dotnet build USBAnywhere-Server.sln -c Release --no-restore

      - name: Run Unit Tests (54 xUnit Tests)
        run: dotnet test USBAnywhere-Server.sln -c Release --no-build --verbosity normal

  build-and-test-macos:
    name: Build & Unit Tests (Swift macOS Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test Swift Server
        run: |
          cd src/USBAnywhere.Server.Mac
          swift build -c release
          swift test

      - name: Verify CLI Execution & IOKit Device Enumeration
        run: |
          cd src/USBAnywhere.Server.Mac
          swift run usbanywhere-server-mac help
          swift run usbanywhere-server-mac list

      - name: Live TCP Loopback Test (Protocol Handshake on Port 3240)
        run: |
          cd src/USBAnywhere.Server.Mac
          swift run usbanywhere-server-mac serve --port 3240 &
          SERVER_PID=$!
          sleep 3
          python3 ../../tests/test_live_server_macos.py
          kill $SERVER_PID
