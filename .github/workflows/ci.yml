name: CI Build & Zero-Trust Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test-windows:
    name: Build & xUnit Tests (.NET 9 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore USBAnywhere-Server.sln

      - name: Build Release
        run: dotnet build USBAnywhere-Server.sln -c Release --no-restore

      - name: Run Unit Tests (54 xUnit Tests)
        run: dotnet test USBAnywhere-Server.sln -c Release --no-build --verbosity normal

      - name: Test Mac-client discovery and reconnect worker
        shell: powershell
        run: |
          src/USBAnywhere.Server.Mac/WindowsClient/test-discovery.ps1
          src/USBAnywhere.Server.Mac/WindowsClient/test-reconnect-worker.ps1
          src/USBAnywhere.Server.Mac/WindowsClient/test-install-reconnect.ps1

  build-and-test-macos:
    name: Build & Unit Tests (Swift macOS Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test Swift Server
        run: |
          cd src/USBAnywhere.Server.Mac
          swift build -c release
          swift test

      - name: Verify CLI and package the Mac app
        run: |
          src/USBAnywhere.Server.Mac/build.sh
          src/USBAnywhere.Server.Mac/build/usbanywhere-server-mac --help
          src/USBAnywhere.Server.Mac/build/usbanywhere-server-mac list

      - name: Live loopback protocol checks (no hardware capture)
        run: |
          python3 tests/test_live_server_macos.py src/USBAnywhere.Server.Mac/build/usbanywhere-server-mac

      - name: Installer rollback checks (isolated filesystem)
        run: python3 -m unittest discover -s tests -p test_install_server_mac.py -v

      - name: Package development DMG and ZIP
        env:
          SKIP_BUILD: '1'
        run: src/USBAnywhere.Server.Mac/package.sh

      - name: Save development installers
        uses: actions/upload-artifact@v4
        with:
          name: USBAnywhere-macOS-development
          path: |
            src/USBAnywhere.Server.Mac/build/*-dev.dmg
            src/USBAnywhere.Server.Mac/build/*-dev.zip
            src/USBAnywhere.Server.Mac/build/*.sha256

      - name: Verify Control Suite (usbanywhere-ctl) on macOS
        run: |
          chmod +x scripts/usbanywhere-ctl
          python3 tests/test_control_suite.py
          python3 scripts/usbanywhere-ctl doctor
          python3 scripts/usbanywhere-ctl status

  build-and-test-linux:
    name: Control Suite & Integration Tests (Linux Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hwdata python3
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic 2>/dev/null || true

      - name: Verify Shell Scripts Syntax
        run: |
          bash -n scripts/install-server-linux.sh
          bash -n scripts/uninstall-server-linux.sh
          bash -n scripts/install-server-mac.sh
          bash -n scripts/uninstall-server-mac.sh

      - name: Run Control Suite Unit Tests
        run: |
          chmod +x scripts/usbanywhere-ctl
          python3 tests/test_control_suite.py

      - name: Run USBAnywhere System Doctor on Linux
        run: |
          python3 scripts/usbanywhere-ctl doctor

      - name: Verify Control Suite Status & List
        run: |
          python3 scripts/usbanywhere-ctl status --json
          python3 scripts/usbanywhere-ctl list

      - name: Live TCP Loopback Test (Protocol Handshake on Port 3240)
        run: |
          python3 tests/mock_usbip_server.py &
          sleep 1
          python3 scripts/usbanywhere-ctl test
